    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .checkbox-custom {
            accent-color: #10b981;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        
        .movie-label { transition: color 0.3s ease, text-decoration-color 0.3s ease; }
        .watched-text {
            color: #6b7280;
            text-decoration: line-through;
            text-decoration-color: #10b981;
            text-decoration-thickness: 2px;
        }

        /* Spinner for loading state */
        .loader {
            border: 4px solid #374151;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom scrollbar for inner genre cards */
        .card-scroll::-webkit-scrollbar { width: 6px; }
        .card-scroll::-webkit-scrollbar-track { background: transparent; }
        .card-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .card-scroll::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* Highlight pulse when locating a randomly picked item */
        @keyframes emeraldPulse {
            0%, 100% { background-color: transparent; }
            25%, 75% { background-color: rgba(16, 185, 129, 0.25); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
        }
        .locate-highlight {
            animation: emeraldPulse 2.2s ease-in-out;
            border-radius: 0.5rem;
        }
    </style>

        const legacyAliases = {
            "crazy stupid love": "Crazy, Stupid, Love.",
            "love rosie": "Love, Rosie",
            "love simon": "Love, Simon",

            "mamma mia here we go again": "Mamma Mia! Here We Go Again",

        // ============================================================================
        // 3. AUTHENTICATION, AUTO-MIGRATION & INITIALIZATION
        // ============================================================================
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return; 

                onSnapshot(moviesCollectionRef, async (snapshot) => {
                    if (isMigratingOrSeeding) return;

                    if (snapshot.empty) {
                        isMigratingOrSeeding = true;
                        document.getElementById('seeding-msg').classList.remove('hidden');
                        const batch = writeBatch(db);
                        refinedCatalog.forEach(item => {
                            const newRef = doc(moviesCollectionRef);
                            batch.set(newRef, {
                                title: item.title,
                                genre: item.genre,
                                type: item.type,
                                watched: false,
                                timestamp: Date.now()
                            });
                        });
                        await batch.commit();
                        isMigratingOrSeeding = false;
                        return;
                    }

                    const rawDocs = [];
                    snapshot.forEach(d => rawDocs.push({ id: d.id, ...d.data() }));

                    const needsMigration = rawDocs.some(d => 
                        !d.type || 
                        d.genre === "TV Series" || 
                        d.title === "Christopher Nolan Movies"
                    );

                    if (needsMigration) {
                        isMigratingOrSeeding = true;
                        document.getElementById('seeding-msg').classList.remove('hidden');
                        await runSmartMigration(rawDocs);
                        isMigratingOrSeeding = false;
                        return;
                    }

                    moviesList = rawDocs;
                    renderUI();
                    
                    document.getElementById('loading-container').classList.add('hidden');
                    document.getElementById('genres-container').classList.remove('hidden');

                }, (error) => {
                    console.error("Firestore error: ", error);
                    document.getElementById('seeding-msg').innerText = "Database connection error.";
                    document.getElementById('seeding-msg').classList.remove('hidden');
                });

            } catch (error) {
                console.error("Initialization Error:", error);
            }
        }

        async function runSmartMigration(existingDocs) {
            const batch = writeBatch(db);
            const catalogMap = new Map();
            refinedCatalog.forEach(item => catalogMap.set(item.title.toLowerCase(), item));

            const seenCanonicalTitles = new Set();

            for (const docItem of existingDocs) {
                const rawLower = (docItem.title || "").trim().toLowerCase();
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docItem.id);

                if (rawLower === "christopher nolan movies") {
                    batch.delete(docRef);
                    continue;
                }

                const canonicalTitle = legacyAliases[rawLower] || docItem.title.trim();
                const canonicalLower = canonicalTitle.toLowerCase();

                if (seenCanonicalTitles.has(canonicalLower)) {
                    batch.delete(docRef);
                    continue;
                }
                seenCanonicalTitles.add(canonicalLower);

                const catalogMatch = catalogMap.get(canonicalLower);
                if (catalogMatch) {
                    batch.update(docRef, {
                        title: catalogMatch.title,
                        genre: catalogMatch.genre,
                        type: catalogMatch.type
                    });
                } else {
                    const inferredType = docItem.genre === "TV Series" ? "series" : (docItem.type || "movie");
                    const inferredGenre = docItem.genre === "TV Series" ? "Drama" : (docItem.genre || "Drama");
                    batch.update(docRef, {
                        type: inferredType,
                        genre: inferredGenre
                    });
                }
            }

            for (const item of refinedCatalog) {
                if (!seenCanonicalTitles.has(item.title.toLowerCase())) {
                    const newRef = doc(moviesCollectionRef);
                    batch.set(newRef, {
                        title: item.title,
                        genre: item.genre,
                        type: item.type,
                        watched: false,
                        timestamp: Date.now()
                    });
                }
            }

            await batch.commit();
        }

        // ============================================================================
        // 4. RENDERING & TAB SWITCHING LOGIC
        // ============================================================================
        function setTab(tabName) {
            activeTab = tabName;
            
            const typeSelect = document.getElementById('movie-type');
            if (typeSelect) typeSelect.value = tabName;

            const tabMovieBtn = document.getElementById('tab-movie');
            const tabSeriesBtn = document.getElementById('tab-series');
            const badgeMovie = document.getElementById('badge-movie');
            const badgeSeries = document.getElementById('badge-series');
            const pickRandomLabel = document.getElementById('pick-random-label');

            if (tabName === 'movie') {
                tabMovieBtn.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2.5 px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 bg-emerald-600 text-white shadow-md';
                badgeMovie.className = 'px-2 py-0.5 text-xs rounded-full bg-emerald-800 text-emerald-100';
                
                tabSeriesBtn.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2.5 px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 text-gray-400 hover:text-white';
                badgeSeries.className = 'px-2 py-0.5 text-xs rounded-full bg-gray-700 text-gray-300';
                pickRandomLabel.innerText = 'Pick Random Movie';
            } else {
                tabSeriesBtn.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2.5 px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 bg-emerald-600 text-white shadow-md';
                badgeSeries.className = 'px-2 py-0.5 text-xs rounded-full bg-emerald-800 text-emerald-100';
                
                tabMovieBtn.className = 'flex-1 sm:flex-initial flex items-center justify-center gap-2.5 px-6 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 text-gray-400 hover:text-white';
                badgeMovie.className = 'px-2 py-0.5 text-xs rounded-full bg-gray-700 text-gray-300';
                pickRandomLabel.innerText = 'Pick Random Series';
            }

            renderUI();
        }

        function renderUI() {
            const container = document.getElementById('genres-container');
            
            const currentWindowScrollY = window.scrollY;
            const cardScrollStates = {};
            const existingLists = container.querySelectorAll('.card-scroll');
            existingLists.forEach(list => {
                const genreName = list.getAttribute('data-genre-name');
                if (genreName) {
                    cardScrollStates[genreName] = list.scrollTop;
                }
            });

            container.innerHTML = ''; 

            const allMovies = moviesList.filter(m => (m.type || 'movie') === 'movie');
            const allSeries = moviesList.filter(m => m.type === 'series');
            const watchedMoviesCount = allMovies.filter(m => m.watched).length;
            const watchedSeriesCount = allSeries.filter(m => m.watched).length;

            document.getElementById('badge-movie').innerText = `${watchedMoviesCount}/${allMovies.length}`;
            document.getElementById('badge-series').innerText = `${watchedSeriesCount}/${allSeries.length}`;

            const itemsForActiveTab = activeTab === 'movie' ? allMovies : allSeries;

            const groupedItems = itemsForActiveTab.reduce((acc, item) => {
                if (!acc[item.genre]) acc[item.genre] = [];
                acc[item.genre].push(item);
                return acc;
            }, {});

            const sortedGenres = Object.keys(groupedItems).sort();
            let totalInTab = 0;
            let watchedInTab = 0;

            sortedGenres.forEach(genre => {
                const itemsInGenre = groupedItems[genre];
                itemsInGenre.sort((a, b) => a.title.localeCompare(b.title));

                const genreCard = document.createElement('div');
                genreCard.className = 'bg-gray-800 rounded-2xl shadow-lg border border-gray-700 p-5 flex flex-col h-full max-h-[450px] transition-transform duration-300 hover:shadow-xl';
                
                const completedInGenre = itemsInGenre.filter(m => m.watched).length;
                const genreTitle = document.createElement('h3');
                genreTitle.className = 'text-lg font-bold text-emerald-400 mb-4 border-b border-gray-700 pb-2 flex justify-between items-end';
                genreTitle.innerHTML = `${genre} <span class="text-sm font-normal text-gray-500">${completedInGenre}/${itemsInGenre.length}</span>`;
                genreCard.appendChild(genreTitle);

                const list = document.createElement('ul');
                list.className = 'space-y-3 overflow-y-auto flex-grow pr-3 card-scroll';
                list.setAttribute('data-genre-name', genre);

                itemsInGenre.forEach(item => {
                    totalInTab++;
                    if (item.watched) watchedInTab++;

                    const listItem = document.createElement('li');
                    listItem.id = `item-row-${item.id}`;
                    listItem.className = 'flex items-start justify-between gap-3 group px-1.5 py-0.5 transition-colors';

                    const isChecked = item.watched ? 'checked' : '';
                    const labelClass = item.watched 
                        ? 'movie-label watched-text flex-1 select-none pt-0.5 leading-snug cursor-pointer' 
                        : 'movie-label text-gray-200 flex-1 select-none pt-0.5 leading-snug group-hover:text-white transition-colors cursor-pointer';

                    listItem.innerHTML = `
                        <div class="flex items-start gap-3 flex-1 min-w-0">
                            <input 
                                type="checkbox" 
                                id="chk-${item.id}" 
                                class="checkbox-custom mt-1 shrink-0 bg-gray-900 border-gray-600 rounded focus:ring-emerald-500 transition duration-150 ease-in-out"
                                ${isChecked}
                                data-id="${item.id}"
                                data-watched="${item.watched}"
                            >
                            <label for="chk-${item.id}" class="${labelClass} break-words">
                                ${item.title}
                            </label>
                        </div>
                        <button 
                            type="button"
                            class="delete-btn text-gray-500 hover:text-red-400 opacity-60 sm:opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all duration-150 p-1 rounded hover:bg-gray-700/50 shrink-0"
                            data-id="${item.id}"
                            title="Remove from watchlist"
                            aria-label="Remove ${item.title}"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    list.appendChild(listItem);
                });

                genreCard.appendChild(list);
                container.appendChild(genreCard);
            });

            document.getElementById('progress-label').innerText = activeTab === 'movie' ? 'Movies Completion' : 'TV Series Completion';
            document.getElementById('progress-text').innerText = `${watchedInTab} / ${totalInTab}`;
            const percentage = totalInTab === 0 ? 0 : Math.round((watchedInTab / totalInTab) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            window.scrollTo(0, currentWindowScrollY);
            const newLists = container.querySelectorAll('.card-scroll');
            newLists.forEach(list => {
                const genreName = list.getAttribute('data-genre-name');
                if (genreName && cardScrollStates[genreName] !== undefined) {
                    list.scrollTop = cardScrollStates[genreName];
                }
            });
        }

        // ============================================================================
        // 5. RANDOM PICKER LOGIC
        // ============================================================================
        function pickRandomUnwatched() {
            const modal = document.getElementById('random-modal');
            const titleEl = document.getElementById('random-title');
            const badgeEl = document.getElementById('random-badge');
            const actionsEl = document.getElementById('random-actions');

            const unwatchedPool = moviesList.filter(item => 
                (item.type || 'movie') === activeTab && !item.watched
            );

            modal.classList.remove('hidden');

            const typeLabel = activeTab === 'movie' ? '🎬 Movie' : '📺 TV Series';

            if (unwatchedPool.length === 0) {
                currentRandomPick = null;
                badgeEl.innerText = `${typeLabel} • All Caught Up!`;
                titleEl.innerText = `You've watched every ${activeTab === 'movie' ? 'movie' : 'series'} in this tab! 🎉`;
                actionsEl.classList.add('hidden');
                return;
            }

            actionsEl.classList.remove('hidden');

            // Avoid picking the exact same item twice in a row if more than 1 unwatched item exists
            let candidates = unwatchedPool;
            if (unwatchedPool.length > 1 && currentRandomPick) {
                candidates = unwatchedPool.filter(i => i.id !== currentRandomPick.id);
            }

            const winner = candidates[Math.floor(Math.random() * candidates.length)];
            currentRandomPick = winner;

            // Brief slot-machine shuffle effect before revealing the winner
            if (shuffleInterval) clearInterval(shuffleInterval);
            let ticks = 0;
            const maxTicks = 8;
            badgeEl.innerText = `${typeLabel} • Shuffling...`;

            shuffleInterval = setInterval(() => {
                const tempItem = unwatchedPool[Math.floor(Math.random() * unwatchedPool.length)];
                titleEl.innerText = tempItem.title;
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(shuffleInterval);
                    titleEl.innerText = winner.title;
                    badgeEl.innerText = `${typeLabel} • ${winner.genre}`;
                }
            }, 45);
        }

        function closeRandomModal() {
            if (shuffleInterval) clearInterval(shuffleInterval);
            document.getElementById('random-modal').classList.add('hidden');
        }

        // ============================================================================
        // 6. EVENT LISTENERS
        // ============================================================================
        document.getElementById('tab-movie').addEventListener('click', () => setTab('movie'));
        document.getElementById('tab-series').addEventListener('click', () => setTab('series'));

        // Random Picker Listeners
        document.getElementById('pick-random-btn').addEventListener('click', pickRandomUnwatched);
        document.getElementById('spin-again-btn').addEventListener('click', pickRandomUnwatched);
        document.getElementById('close-modal-btn').addEventListener('click', closeRandomModal);

        // Close modal when clicking backdrop or pressing Escape
        document.getElementById('random-modal').addEventListener('click', (e) => {
            if (e.target.id === 'random-modal') closeRandomModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeRandomModal();
        });

        // Locate Picked Item in List
        document.getElementById('locate-item-btn').addEventListener('click', () => {
            if (!currentRandomPick) return;
            const targetRow = document.getElementById(`item-row-${currentRandomPick.id}`);
            closeRandomModal();
            if (targetRow) {
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetRow.classList.remove('locate-highlight');
                void targetRow.offsetWidth; // trigger reflow to restart animation
                targetRow.classList.add('locate-highlight');
            }
        });

        // Mark Picked Item as Watched directly from Modal
        document.getElementById('mark-watched-modal-btn').addEventListener('click', async () => {
            if (!currentRandomPick || !auth.currentUser) return;
            const btn = document.getElementById('mark-watched-modal-btn');
            btn.disabled = true;
            try {
                const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', currentRandomPick.id);
                await updateDoc(movieRef, { watched: true });
                closeRandomModal();
            } catch (error) {
                console.error("Error marking watched from modal:", error);
            }
            btn.disabled = false;
        });

        // Add New Movie or Series
        document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            const titleInput = document.getElementById('movie-title');
            const typeInput = document.getElementById('movie-type');
            const genreInput = document.getElementById('movie-genre');
            const addBtn = document.getElementById('add-btn');
            
            const title = titleInput.value.trim();
            const type = typeInput.value;
            const genre = genreInput.value;
            
            if (title && genre && type) {
                if (moviesList.some(m => m.title.toLowerCase() === title.toLowerCase() && (m.type || 'movie') === type)) {
                    showInputFeedback(titleInput, "Already in watchlist!", true);
                    return;
                }

                addBtn.disabled = true;
                try {
                    await addDoc(moviesCollectionRef, {
                        title: title,
                        genre: genre,
                        type: type,
                        watched: false,
                        timestamp: Date.now()
                    });
                    titleInput.value = '';
                    genreInput.value = '';
                    if (activeTab !== type) {
                        setTab(type);
                    }
                    showInputFeedback(titleInput, "Added to cloud!", false);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    showInputFeedback(titleInput, "Error saving.", true);
                }
                addBtn.disabled = false;
            }
        });

        // Toggle checkbox
        document.getElementById('genres-container').addEventListener('change', async (e) => {
            if (e.target && e.target.classList.contains('checkbox-custom')) {
                const docId = e.target.getAttribute('data-id');
                const isWatchedStr = e.target.getAttribute('data-watched');
                const currentlyWatched = isWatchedStr === 'true';

                if (!auth.currentUser || !docId) return;

                const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docId);
                try {
                    await updateDoc(movieRef, {
                        watched: !currentlyWatched
                    });
                } catch (error) {
                    console.error("Error updating document:", error);
                    e.target.checked = currentlyWatched;
                }
            }
        });

        // Remove item from Firestore
        document.getElementById('genres-container').addEventListener('click', async (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (!deleteBtn) return;

            const docId = deleteBtn.getAttribute('data-id');
            if (!auth.currentUser || !docId) return;

            deleteBtn.disabled = true;
            const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docId);
            try {
                await deleteDoc(movieRef);
            } catch (error) {
                console.error("Error deleting document:", error);
                deleteBtn.disabled = false;
            }
        });

        function showInputFeedback(element, message, isError) {
            const originalPlaceholder = element.placeholder;
            element.value = '';
            element.placeholder = message;
            if (isError) element.classList.add('border-red-500', 'placeholder-red-400');
            else element.classList.add('border-emerald-500', 'placeholder-emerald-400');
            setTimeout(() => {
                element.placeholder = originalPlaceholder;
                element.classList.remove('border-red-500', 'placeholder-red-400', 'border-emerald-500', 'placeholder-emerald-400');
            }, 2500);
        }

        initApp();

    </script>
