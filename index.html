<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist</title>
    <!-- Apple-Inspired Sky Blue Film Slate Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364d2ff'><path d='M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ios-bg: #07080c;
            --ios-card: #13151c;
            --ios-grouped-inset: #191c26;
            --ios-elevated: #242836;
            --ios-border: rgba(255, 255, 255, 0.07);
            --ios-sky: #64d2ff;
            --ios-sky-deep: #0a84ff;
            --ios-red: #ff453a;
            --ios-red-soft: #ff6961;
            --ios-text-primary: #ffffff;
            --ios-text-secondary: rgba(235, 235, 245, 0.62);
            --ios-text-tertiary: rgba(235, 235, 245, 0.36);
        }

        body {
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(ellipse 65% 40% at 22% -8%, rgba(100, 210, 255, 0.11), transparent),
                radial-gradient(ellipse 65% 40% at 78% -8%, rgba(255, 69, 58, 0.09), transparent);
            color: var(--ios-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle iOS Dark Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

        .card-scroll::-webkit-scrollbar { width: 4px; }
        .card-scroll::-webkit-scrollbar-track { background: transparent; }
        .card-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
        .card-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }

        /* Solid Opaque iOS Surface (Zero Transparency Increase, Rich Dual-Tint Elevation) */
        .ios-tinted-card {
            background: linear-gradient(180deg, #151821 0%, #101219 100%);
            border: 1px solid var(--ios-border);
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.72), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
            border-radius: 24px;
        }

        .ios-tinted-card:hover {
            border-color: rgba(100, 210, 255, 0.16);
        }

        /* iOS Inset Grouped List Surface inside genre cards */
        .ios-inset-group {
            background-color: #181b24;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }

        /* Native iOS Hairline Row Divider */
        .ios-row + .ios-row {
            border-top: 1px solid rgba(255, 255, 255, 0.055);
        }

        .ios-input {
            background-color: #1a1d27;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ios-input:focus {
            outline: none;
            border-color: var(--ios-sky);
            box-shadow: 0 0 0 3px rgba(100, 210, 255, 0.2);
            background-color: #1f2330;
        }

        /* iOS Spotlight Search Bar (Opaque Dark Capsule) */
        .ios-spotlight {
            background-color: #151821;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
            transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ios-spotlight:focus-within {
            border-color: var(--ios-sky);
            box-shadow: 0 0 0 3px rgba(100, 210, 255, 0.18), inset 0 1px 2px rgba(0, 0, 0, 0.45);
            background-color: #1a1e29;
        }

        /* iOS Reminders-Style Circular Checkbox */
        .checkbox-custom {
            appearance: none;
            -webkit-appearance: none;
            width: 1.35rem;
            height: 1.35rem;
            border: 1.75px solid rgba(235, 235, 245, 0.32);
            border-radius: 9999px;
            background-color: #12141c;
            cursor: pointer;
            display: inline-grid;
            place-content: center;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .checkbox-custom:hover {
            border-color: var(--ios-sky);
        }

        .checkbox-custom::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 0.18s transform cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #06121c;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-custom:checked {
            background-color: var(--ios-sky);
            border-color: var(--ios-sky);
            box-shadow: 0 0 10px rgba(100, 210, 255, 0.32);
            transform: scale(1.03);
        }

        .checkbox-custom:checked::before {
            transform: scale(1);
        }

        .movie-label {
            transition: color 0.25s ease, opacity 0.25s ease;
            letter-spacing: -0.012em;
        }

        .watched-text {
            color: var(--ios-text-tertiary);
            text-decoration: line-through;
            text-decoration-color: rgba(255, 69, 58, 0.55);
            text-decoration-thickness: 1.5px;
        }

        /* Subtle indicator while item waits 2s before moving to bottom */
        .pending-move {
            background-color: rgba(100, 210, 255, 0.09);
            transition: background-color 0.3s ease;
        }

        /* Spinner for loading state */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--ios-sky);
            border-right: 3px solid var(--ios-red);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Highlight pulse when locating a randomly picked item */
        @keyframes skyCoralPulse {
            0%, 100% { background-color: transparent; }
            25%, 75% { background-color: rgba(100, 210, 255, 0.2); box-shadow: inset 0 0 0 1.5px rgba(100, 210, 255, 0.45); }
        }
        .locate-highlight {
            animation: skyCoralPulse 2.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-[#64d2ff]/25 selection:text-[#64d2ff]">

    <!-- Apple-Style Sticky Opaque Top Bar -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#64d2ff]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>

        // ============================================================================
        // 3. AUTHENTICATION, AUTO-MIGRATION & INITIALIZATION
        // ============================================================================
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return; 

                onSnapshot(moviesCollectionRef, async (snapshot) => {
                    if (isMigratingOrSeeding) return;

                    if (snapshot.empty) {
                        isMigratingOrSeeding = true;
                        document.getElementById('seeding-msg').classList.remove('hidden');
                        const batch = writeBatch(db);
                        refinedCatalog.forEach(item => {
                            const newRef = doc(moviesCollectionRef);
                            batch.set(newRef, {
                                title: item.title,
                                genre: item.genre,
                                type: item.type,
                                watched: false,
                                timestamp: Date.now()
                            });
                        });
                        await batch.commit();
                        isMigratingOrSeeding = false;
                        return;
                    }

                    const rawDocs = [];
                    snapshot.forEach(d => rawDocs.push({ id: d.id, ...d.data() }));

                    const needsMigration = rawDocs.some(d => 
                        !d.type || 
                        d.genre === "TV Series" || 
                        d.title === "Christopher Nolan Movies"
                    );

                    if (needsMigration) {
                        isMigratingOrSeeding = true;
                        document.getElementById('seeding-msg').classList.remove('hidden');
                        await runSmartMigration(rawDocs);
                        isMigratingOrSeeding = false;
                        return;
                    }

                    moviesList = rawDocs;
                    renderUI();
                    
                    document.getElementById('loading-container').classList.add('hidden');
                    document.getElementById('genres-container').classList.remove('hidden');

                }, (error) => {
                    console.error("Firestore error: ", error);
                    document.getElementById('seeding-msg').innerText = "Database connection error.";
                    document.getElementById('seeding-msg').classList.remove('hidden');
                });

            } catch (error) {
                console.error("Initialization Error:", error);
            }
        }

        async function runSmartMigration(existingDocs) {
            const batch = writeBatch(db);
            const catalogMap = new Map();
            refinedCatalog.forEach(item => catalogMap.set(item.title.toLowerCase(), item));

            const seenCanonicalTitles = new Set();

            for (const docItem of existingDocs) {
                const rawLower = (docItem.title || "").trim().toLowerCase();
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docItem.id);

                if (rawLower === "christopher nolan movies") {
                    batch.delete(docRef);
                    continue;
                }

                const canonicalTitle = legacyAliases[rawLower] || docItem.title.trim();
                const canonicalLower = canonicalTitle.toLowerCase();

                if (seenCanonicalTitles.has(canonicalLower)) {
                    batch.delete(docRef);
                    continue;
                }
                seenCanonicalTitles.add(canonicalLower);

                const catalogMatch = catalogMap.get(canonicalLower);
                if (catalogMatch) {
                    batch.update(docRef, {
                        title: catalogMatch.title,
                        genre: catalogMatch.genre,
                        type: catalogMatch.type
                    });
                } else {
                    const inferredType = docItem.genre === "TV Series" ? "series" : (docItem.type || "movie");
                    const inferredGenre = docItem.genre === "TV Series" ? "Drama" : (docItem.genre || "Drama");
                    batch.update(docRef, {
                        type: inferredType,
                        genre: inferredGenre
                    });
                }
            }

            for (const item of refinedCatalog) {
                if (!seenCanonicalTitles.has(item.title.toLowerCase())) {
                    const newRef = doc(moviesCollectionRef);
                    batch.set(newRef, {
                        title: item.title,
                        genre: item.genre,
                        type: item.type,
                        watched: false,
                        timestamp: Date.now()
                    });
                }
            }

            await batch.commit();
        }

        // 4. RENDERING, SPOTLIGHT FILTER, 2-SECOND DELAYED SORT & TAB SWITCHING
        // ============================================================================
        function getEffectiveSortWatched(item) {
            if (recentlyToggledSortState.has(item.id)) {
                return recentlyToggledSortState.get(item.id).sortWatched;
            }
            return Boolean(item.watched);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function highlightMatch(text, query) {
            if (!query) return escapeHtml(text);
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return escapeHtml(text).replace(regex, '<mark class="bg-[#64d2ff]/20 text-[#64d2ff] rounded px-0.5 font-medium">$1</mark>');
        }

        function renderUI() {
            const container = document.getElementById('genres-container');
            
            const currentWindowScrollY = window.scrollY;
            const cardScrollStates = {};
            const existingLists = container.querySelectorAll('.card-scroll');
            existingLists.forEach(list => {
                const genreName = list.getAttribute('data-genre-name');
                if (genreName) {
                    cardScrollStates[genreName] = list.scrollTop;
                }
            });

            container.innerHTML = ''; 

            const allMovies = moviesList.filter(m => (m.type || 'movie') === 'movie');
            const allSeries = moviesList.filter(m => m.type === 'series');
            const watchedMoviesCount = allMovies.filter(m => m.watched).length;
            const watchedSeriesCount = allSeries.filter(m => m.watched).length;

            document.getElementById('badge-movie').innerText = `${watchedMoviesCount}/${allMovies.length}`;
            document.getElementById('badge-series').innerText = `${watchedSeriesCount}/${allSeries.length}`;

            const itemsForActiveTab = activeTab === 'movie' ? allMovies : allSeries;
            const totalInTab = itemsForActiveTab.length;
            const watchedInTab = itemsForActiveTab.filter(m => m.watched).length;

            // Update Top Nav Progress Bar (always reflects full tab progress)
            document.getElementById('progress-label').innerText = activeTab === 'movie' ? 'Movies' : 'Series';
            document.getElementById('progress-text').innerText = `${watchedInTab} / ${totalInTab}`;
            const percentage = totalInTab === 0 ? 0 : Math.round((watchedInTab / totalInTab) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Apply Spotlight Search Filter (matches title or genre)
            const normalizedQuery = searchQuery.trim().toLowerCase();
            const filteredItems = normalizedQuery
                ? itemsForActiveTab.filter(item =>
                    item.title.toLowerCase().includes(normalizedQuery) ||
                    item.genre.toLowerCase().includes(normalizedQuery)
                )
                : itemsForActiveTab;

            // Empty Search State
            if (filteredItems.length === 0 && normalizedQuery) {
                const otherTabItems = activeTab === 'movie' ? allSeries : allMovies;
                const otherTabMatches = otherTabItems.filter(item =>
                    item.title.toLowerCase().includes(normalizedQuery) ||
                    item.genre.toLowerCase().includes(normalizedQuery)
                ).length;

                const emptyState = document.createElement('div');
                emptyState.className = 'col-span-full ios-tinted-card p-10 text-center flex flex-col items-center justify-center';
                emptyState.innerHTML = `
                    <div class="w-12 h-12 rounded-2xl bg-[#1c202b] border border-white/[0.08] flex items-center justify-center mb-3 text-[#64d2ff]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
                        </svg>
                    </div>
                    <p class="text-base font-semibold text-white mb-1">No ${activeTab === 'movie' ? 'movies' : 'series'} found for "${escapeHtml(searchQuery.trim())}"</p>
                    <p class="text-xs text-[#ebebf5]/50 mb-4">Try searching for another title or genre.</p>
                    ${otherTabMatches > 0 ? `
                        <button type="button" id="switch-tab-search-btn" class="px-4 py-2 rounded-full text-xs font-semibold bg-[#1c2533] text-[#64d2ff] border border-[#64d2ff]/30 hover:bg-[#233042] transition-colors">
                            View ${otherTabMatches} match${otherTabMatches > 1 ? 'es' : ''} in${activeTab === 'movie' ? 'TV Series' : 'Movies'} →
                        </button>
                    ` : ''}
                `;
                container.appendChild(emptyState);

                const switchBtn = document.getElementById('switch-tab-search-btn');
                if (switchBtn) {
                    switchBtn.addEventListener('click', () => setTab(activeTab === 'movie' ? 'series' : 'movie'));
                }
                return;
            }

            const groupedItems = filteredItems.reduce((acc, item) => {
                if (!acc[item.genre]) acc[item.genre] = [];
                acc[item.genre].push(item);
                return acc;
            }, {});

            const sortedGenres = Object.keys(groupedItems).sort();

            sortedGenres.forEach(genre => {
                const itemsInGenre = groupedItems[genre];

                // Sort: Unwatched at top (alphabetical), Watched at bottom (alphabetical)
                itemsInGenre.sort((a, b) => {
                    const aWatchedSort = getEffectiveSortWatched(a);
                    const bWatchedSort = getEffectiveSortWatched(b);
                    if (aWatchedSort !== bWatchedSort) {
                        return aWatchedSort ? 1 : -1;
                    }
                    return a.title.localeCompare(b.title);
                });

                const genreCard = document.createElement('div');
                genreCard.className = 'ios-tinted-card p-5 flex flex-col h-full max-h-[470px] transition-all duration-300';
                
                const completedInGenre = itemsInGenre.filter(m => m.watched).length;
                const genreTitle = document.createElement('h3');
                genreTitle.className = 'text-base font-semibold tracking-tight text-white mb-3 px-1 flex justify-between items-center';
                genreTitle.innerHTML = `
                    <span class="flex items-center gap-2">
                        <span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-[#64d2ff] to-[#ff453a]"></span>
                        <span>${highlightMatch(genre, normalizedQuery)}</span>
                    </span>
                    <span class="text-xs font-medium px-2.5 py-0.5 rounded-full bg-[#1e222f] text-[#64d2ff] border border-[#64d2ff]/15 tabular-nums">${completedInGenre} / ${itemsInGenre.length}</span>
                `;
                genreCard.appendChild(genreTitle);

                // iOS Grouped Inset Table Container
                const list = document.createElement('ul');
                list.className = 'ios-inset-group overflow-y-auto flex-grow px-2 py-1 card-scroll';
                list.setAttribute('data-genre-name', genre);

                itemsInGenre.forEach(item => {
                    const isPendingMove = recentlyToggledSortState.has(item.id);
                    const listItem = document.createElement('li');
                    listItem.id = `item-row-${item.id}`;
                    listItem.className = `ios-row flex items-center justify-between gap-3 group px-2.5 py-2.5 rounded-xl hover:bg-white/[0.03] transition-all ${isPendingMove ? 'pending-move' : ''}`;

                    const isChecked = item.watched ? 'checked' : '';
                    const labelClass = item.watched 
                        ? 'movie-label watched-text text-sm flex-1 select-none leading-snug cursor-pointer' 
                        : 'movie-label text-[#ffffff]/92 text-sm flex-1 select-none leading-snug group-hover:text-white transition-colors cursor-pointer';

                    listItem.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <input 
                                type="checkbox" 
                                id="chk-${item.id}" 
                                class="checkbox-custom shrink-0"
                                ${isChecked}
                                data-id="${item.id}"
                                data-watched="${item.watched}"
                            >
                            <label for="chk-${item.id}" class="${labelClass} break-words">
                                ${highlightMatch(item.title, normalizedQuery)}
                            </label>
                        </div>
                        <button 
                            type="button"
                            class="delete-btn text-[#ebebf5]/30 hover:text-[#ff453a] opacity-60 sm:opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all duration-150 p-1 rounded-lg hover:bg-[#ff453a]/10 shrink-0"
                            data-id="${item.id}"
                            title="Remove from watchlist"
                            aria-label="Remove ${escapeHtml(item.title)}"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    `;
                    list.appendChild(listItem);
                });

                genreCard.appendChild(list);
                container.appendChild(genreCard);
            });

            window.scrollTo(0, currentWindowScrollY);
            const newLists = container.querySelectorAll('.card-scroll');
            newLists.forEach(list => {
                const genreName = list.getAttribute('data-genre-name');
                if (genreName && cardScrollStates[genreName] !== undefined) {
                    list.scrollTop = cardScrollStates[genreName];
                }
            });
        }

        // ============================================================================
        // 5. RANDOM PICKER LOGIC
        // ============================================================================
        function pickRandomUnwatched() {
            const modal = document.getElementById('random-modal');
            const titleEl = document.getElementById('random-title');
            const badgeEl = document.getElementById('random-badge');
            const actionsEl = document.getElementById('random-actions');

            const unwatchedPool = moviesList.filter(item => 
                (item.type || 'movie') === activeTab && !item.watched
            );

            modal.classList.remove('hidden');

            const typeLabel = activeTab === 'movie' ? '🎬 Movie' : '📺 TV Series';

            if (unwatchedPool.length === 0) {
                currentRandomPick = null;
                badgeEl.innerText = `${typeLabel} • Complete`;
                titleEl.innerText = `All ${activeTab === 'movie' ? 'movies' : 'series'} watched! 🎉`;
                actionsEl.classList.add('hidden');
                return;
            }

            actionsEl.classList.remove('hidden');

            let candidates = unwatchedPool;
            if (unwatchedPool.length > 1 && currentRandomPick) {
                candidates = unwatchedPool.filter(i => i.id !== currentRandomPick.id);
            }

            const winner = candidates[Math.floor(Math.random() * candidates.length)];
            currentRandomPick = winner;

            if (shuffleInterval) clearInterval(shuffleInterval);
            let ticks = 0;
            const maxTicks = 8;
            badgeEl.innerText = `${typeLabel} • Selecting...`;

            shuffleInterval = setInterval(() => {
                const tempItem = unwatchedPool[Math.floor(Math.random() * unwatchedPool.length)];
                titleEl.innerText = tempItem.title;
                ticks++;
                if (ticks >= maxTicks) {
                    clearInterval(shuffleInterval);
                    titleEl.innerText = winner.title;
                    badgeEl.innerText = `${typeLabel} • ${winner.genre}`;
                }
            }, 45);
        }

        function closeRandomModal() {
            if (shuffleInterval) clearInterval(shuffleInterval);
            document.getElementById('random-modal').classList.add('hidden');
        }

        // ============================================================================
        // 6. EVENT LISTENERS (SPOTLIGHT SEARCH, SHORTCUTS & 2-SEC DELAYED MOVE)
        // ============================================================================
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const searchKbd = document.getElementById('search-kbd');

        function updateSearchUI() {
            searchQuery = searchInput.value;
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
                clearSearchBtn.classList.add('flex');
                searchKbd.classList.add('hidden');
                searchKbd.classList.remove('sm:inline-block');
            } else {
                clearSearchBtn.classList.add('hidden');
                clearSearchBtn.classList.remove('flex');
                searchKbd.classList.remove('hidden');
                searchKbd.classList.add('sm:inline-block');
            }
            renderUI();
        }

        searchInput.addEventListener('input', updateSearchUI);

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            updateSearchUI();
            searchInput.focus();
        });

        // Global Keyboard Shortcuts: Cmd/Ctrl+K or '/' to focus search, Esc to clear
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
                return;
            }
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                e.preventDefault();
                searchInput.focus();
                return;
            }
            if (e.key === 'Escape') {
                const modal = document.getElementById('random-modal');
                if (!modal.classList.contains('hidden')) {
                    closeRandomModal();
                } else if (document.activeElement === searchInput || searchQuery.length > 0) {
                    searchInput.value = '';
                    updateSearchUI();
                    searchInput.blur();
                }
            }
        });

        document.getElementById('tab-movie').addEventListener('click', () => setTab('movie'));
        document.getElementById('tab-series').addEventListener('click', () => setTab('series'));

        document.getElementById('pick-random-btn').addEventListener('click', pickRandomUnwatched);
        document.getElementById('spin-again-btn').addEventListener('click', pickRandomUnwatched);
        document.getElementById('close-modal-btn').addEventListener('click', closeRandomModal);

        document.getElementById('random-modal').addEventListener('click', (e) => {
            if (e.target.id === 'random-modal') closeRandomModal();
        });

        document.getElementById('locate-item-btn').addEventListener('click', () => {
            if (!currentRandomPick) return;
            if (searchQuery.trim() !== '') {
                searchInput.value = '';
                updateSearchUI();
            }
            const targetRow = document.getElementById(`item-row-${currentRandomPick.id}`);
            closeRandomModal();
            if (targetRow) {
                targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetRow.classList.remove('locate-highlight');
                void targetRow.offsetWidth;
                targetRow.classList.add('locate-highlight');
            }
        });

        document.getElementById('mark-watched-modal-btn').addEventListener('click', async () => {
            if (!currentRandomPick || !auth.currentUser) return;
            const btn = document.getElementById('mark-watched-modal-btn');
            btn.disabled = true;
            try {
                const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', currentRandomPick.id);
                await updateDoc(movieRef, { watched: true });
                closeRandomModal();
            } catch (error) {
                console.error("Error marking watched from modal:", error);
            }
            btn.disabled = false;
        });

        document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;

            const titleInput = document.getElementById('movie-title');
            const typeInput = document.getElementById('movie-type');
            const genreInput = document.getElementById('movie-genre');
            const addBtn = document.getElementById('add-btn');
            
            const title = titleInput.value.trim();
            const type = typeInput.value;
            const genre = genreInput.value;
            
            if (title && genre && type) {
                if (moviesList.some(m => m.title.toLowerCase() === title.toLowerCase() && (m.type || 'movie') === type)) {
                    showInputFeedback(titleInput, "Already in library", true);
                    return;
                }

                addBtn.disabled = true;
                try {
                    await addDoc(moviesCollectionRef, {
                        title: title,
                        genre: genre,
                        type: type,
                        watched: false,
                        timestamp: Date.now()
                    });
                    titleInput.value = '';
                    genreInput.value = '';
                    if (activeTab !== type) {
                        setTab(type);
                    }
                    showInputFeedback(titleInput, "Added to library", false);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    showInputFeedback(titleInput, "Error saving", true);
                }
                addBtn.disabled = false;
            }
        });

        // Toggle checkbox with 2-second delay before moving item to bottom/top
        document.getElementById('genres-container').addEventListener('change', async (e) => {
            if (e.target && e.target.classList.contains('checkbox-custom')) {
                const docId = e.target.getAttribute('data-id');
                const isWatchedStr = e.target.getAttribute('data-watched');
                const currentlyWatched = isWatchedStr === 'true';

                if (!auth.currentUser || !docId) return;

                if (recentlyToggledSortState.has(docId)) {
                    clearTimeout(recentlyToggledSortState.get(docId).timerId);
                } else {
                    recentlyToggledSortState.set(docId, {
                        sortWatched: currentlyWatched,
                        timerId: null
                    });
                }

                const timerId = setTimeout(() => {
                    recentlyToggledSortState.delete(docId);
                    renderUI();
                }, 2000);

                recentlyToggledSortState.get(docId).timerId = timerId;

                const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docId);
                try {
                    await updateDoc(movieRef, {
                        watched: !currentlyWatched
                    });
                } catch (error) {
                    console.error("Error updating document:", error);
                    clearTimeout(timerId);
                    recentlyToggledSortState.delete(docId);
                    e.target.checked = currentlyWatched;
                    renderUI();
                }
            }
        });

        // Remove item from Firestore
        document.getElementById('genres-container').addEventListener('click', async (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (!deleteBtn) return;

            const docId = deleteBtn.getAttribute('data-id');
            if (!auth.currentUser || !docId) return;

            deleteBtn.disabled = true;
            const movieRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'movies', docId);
            try {
                await deleteDoc(movieRef);
            } catch (error) {
                console.error("Error deleting document:", error);
                deleteBtn.disabled = false;
            }
        });

        function showInputFeedback(element, message, isError) {
            const originalPlaceholder = element.placeholder;
            element.value = '';
            element.placeholder = message;
            if (isError) element.classList.add('border-[#ff453a]');
            else element.classList.add('border-[#64d2ff]');
            setTimeout(() => {
                element.placeholder = originalPlaceholder;
                element.classList.remove('border-[#ff453a]', 'border-[#64d2ff]');
            }, 2500);
        }

        initApp();

    </script>
</body>
